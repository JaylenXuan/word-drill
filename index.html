<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>背单词</title>
  <meta name="build" content="0.12.1" />

  <!-- 主屏安装：iOS 走 apple-* 这组，Android/桌面走 manifest -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/whale/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/whale/icons/apple-touch-icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="背单词" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- 状态栏/地址栏颜色跟随明暗 -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF9F5" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141A2B" />

  <link rel="stylesheet" href="src/styles.css" />

  <!--
    版本自愈（只清 Service Worker 和离线缓存，绝不动 localStorage）。

    为什么需要它：这个文档是「网络优先」拿到的，永远是最新的；
    但它引用的 JS 由 Service Worker 缓存优先返回，可能是上一个版本。
    浏览器对 sw.js 的自动复查有 24 小时上限，所以升级后可能长时间卡在旧版。

    做法：HTML 里带一个有构建号，和上次记录的不一致、且当前已被旧 SW 接管时，
    注销 SW + 删掉所有 cache + 重载一次。localStorage 一根手指都不碰。
  -->
  <script>
    (function () {
      try {
        var meta = document.querySelector('meta[name="build"]');
        var build = meta ? meta.content : '';
        if (!build) return;

        var seen = localStorage.getItem('vocab.build');
        localStorage.setItem('vocab.build', build);

        if (seen === build) {
          sessionStorage.removeItem('vocab.healing');
          return;
        }
        // 同一会话只自救一次，防止任何情况下重载死循环
        if (sessionStorage.getItem('vocab.healing')) return;
        sessionStorage.setItem('vocab.healing', '1');

        var sw = navigator.serviceWorker;
        var hadRegistration = false;
        var jobs = [];

        if (sw && sw.getRegistrations) {
          jobs.push(sw.getRegistrations().then(function (regs) {
            hadRegistration = regs.length > 0;
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        } else if (sw && sw.controller) {
          hadRegistration = true; // 老浏览器没有 getRegistrations
        }
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }

        Promise.all(jobs).then(function () {
          if (hadRegistration) location.reload();
          else sessionStorage.removeItem('vocab.healing'); // 全新安装，无需重载
        }, function () {
          if (hadRegistration) location.reload();
          else sessionStorage.removeItem('vocab.healing');
        });
      } catch (e) {
        /* 无痕模式等场景写不进存储，忽略 */
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- 首屏占位：脚本加载后由 src/ui/app.js 接管 -->
    <main class="page">
      <h1 class="brand">背单词</h1>
      <p class="muted">正在加载…</p>
    </main>
  </div>
  <noscript>需要开启 JavaScript 才能使用。</noscript>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
